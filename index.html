<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliê Linha & Agulha — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Rozha+One&display=swap" rel="stylesheet">

 <style>
:root{color-scheme:light;--br:#5a2822;--pk:#ffb8d6;--pk2:#ff8fab;--pk3:#ff5c85;--pk4:#cc3d7a;--iv:#fffdf0;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;display:flex;background:var(--iv);color:var(--br);font:500 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
h1,.by{font-family:"Rozha One","Bricolage Grotesque",Georgia,serif;font-weight:400}
h2{margin:0;font-size:24px;font-weight:800}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:210px;flex:none;background:var(--br);color:var(--iv);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(36px + env(safe-area-inset-top,0px)) 16px 36px;text-align:center}
.side img{width:130px;height:auto}
.by{margin:0;font-size:21px;line-height:1.2}
.wrap{flex:1;min-width:0}
.tape{height:58px;background:var(--pk);position:relative;overflow:hidden;
background-image:repeating-linear-gradient(90deg,var(--br) 0 2px,transparent 2px 14px),repeating-linear-gradient(90deg,var(--br) 0 2px,transparent 2px 70px);
background-size:100% 16px,100% 28px;background-repeat:repeat-x;background-position:0 100%}
.tape span{position:absolute;top:2px;font-size:26px;line-height:1}
.in{padding:0 clamp(20px,6vw,72px)}
header{padding-top:8px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.1;margin:0}
header p{margin:6px 0 18px;font-size:18px}
.seg{display:inline-flex;border:2px solid var(--br);border-radius:10px;overflow:hidden}
.seg button{background:var(--pk);border:0;padding:9px 20px;font:inherit;color:var(--br);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--br);color:var(--iv)}
button:focus-visible{outline:3px solid var(--pk4);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:26px 0 40px}
.kpi{background:var(--br);color:var(--iv);border-radius:8px;padding:20px 22px}
.kpi small{font-size:15px}
.kpi b{display:block;font-size:34px;line-height:1.2;color:var(--pk);margin:2px 0 6px}
.kpi em{font-style:normal;font-size:14px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;margin-bottom:40px}
.sub{margin:4px 0 22px;font-size:17px}
.chart{display:flex;align-items:flex-end;gap:12px;height:230px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col i{display:block;width:100%;background:var(--pk);border-radius:4px 4px 0 0;transition:height .4s}
.col span{font-size:13px;margin-bottom:4px}
.lbls{display:flex;gap:12px;margin-top:8px}.lbls span{flex:1;text-align:center;font-size:15px}
.mix{display:flex;height:20px;border-radius:6px;overflow:hidden;margin-bottom:18px}
.leg{display:grid;gap:10px;font-size:17px}.leg div{display:flex;align-items:center;gap:10px}.leg s{width:16px;height:16px;border-radius:4px}.leg b{margin-left:auto;font-weight:800}
.est{margin-bottom:48px}
.bar{margin-bottom:14px}.bar div:first-child{display:flex;justify-content:space-between;margin-bottom:5px}
.trk{height:12px;background:#ffe3ee;border-radius:6px;overflow:hidden}.trk i{display:block;height:100%;background:var(--pk2);border-radius:6px}.trk i.low{background:var(--pk4)}
.low-t{color:var(--pk4);font-weight:800}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:32px}}
@media(max-width:640px){body{flex-direction:column}.side{position:static;height:auto;width:100%;flex-direction:row;padding:14px 18px;gap:14px;text-align:left}.side img{width:56px}.by{font-size:18px}.tape span{font-size:20px}}
@media(prefers-reduced-motion:reduce){.col i{transition:none}}
</style>
</head>

<header><h1>Ateliê Linha &amp; Agulha</h1><p id="hoje">Painel da loja</p>
<div class="seg" role="group" aria-label="Período" id="per"><button data-p="sem" aria-pressed="true">Semana</button><button data-p="mes" aria-pressed="false">Mês</button><button data-p="ano" aria-pressed="false">Ano</button></div></header>

 <div><h2>Faturamento</h2><p class="sub" id="chSub"></p><div class="chart" id="chart"></div><div class="lbls" id="lbls"></div></div>
 <div><h2>O que mais sai</h2><p class="sub">Participação na receita do mês</p><div class="mix" id="mix"></div><div class="leg" id="leg"></div></div>

<script>
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const P={
 sem:{l:['Seg','Ter','Qua','Qui','Sex','Sáb'],v:[820,1140,960,1480,1730,2260],t:'Receita por dia, esta semana',k:[8390,'+12%',23,'+4',364,'+6%',6,'+2']},
 mes:{l:['Sem 1','Sem 2','Sem 3','Sem 4'],v:[7200,8900,8390,9450],t:'Receita por semana, este mês',k:[33940,'+9%',87,'+11',390,'+3%',21,'+5']},
 ano:{l:['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],v:[21,24,29,26,31,34,30,33,36,38,34,0].map(x=>x*1000),t:'Receita por mês, este ano',k:[336000,'+14%',912,'+8%',368,'+5%',188,'+17']}
};
const estoque=[['Algodão cru',38,20],['Linho azul',9,15],['Seda pura',14,10],['Tricoline estampado',52,25],['Forro de poliéster',7,12],['Jeans 12 oz',31,20]];
const mix=[['Sob medida',38,'#ffb8d6'],['Ajustes e barras',27,'#ff8fab'],['Consertos',18,'#ff5c85'],['Bordados',17,'#cc3d7a']];
const $=id=>document.getElementById(id);let per='sem';
$('hoje').textContent='Hoje, '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
function kpis(){const k=P[per].k;
 $('kpis').innerHTML=[['Faturamento',R(k[0]),k[1]],['Peças atendidas',k[2],k[3]],['Ticket médio',R(k[4]),k[5]],['Clientes novos',k[6],k[7]]]
 .map(x=>`<div class="kpi"><small>${x[0]}</small><b>${x[1]}</b><em>${x[2]} vs. período anterior</em></div>`).join('')}
function chart(){const d=P[per],m=Math.max(...d.v);$('chSub').textContent=d.t;
 $('chart').innerHTML=d.v.map(v=>`<div class="col"><span>${v?(v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':v):''}</span><i style="height:${Math.round(v/m*170)}px"></i></div>`).join('');
 $('lbls').innerHTML=d.l.map(l=>`<span>${l}</span>`).join('')}
function resto(){
 $('est').innerHTML=estoque.map(([n,q,m])=>{const lo=q<m;return `<div class="bar"><div><span>${n}</span><span ${lo?'class="low-t"':''}>${q} m${lo?' · repor':''}</span></div><div class="trk"><i class="${lo?'low':''}" style="width:${Math.min(100,q/(m*2)*100)}%"></i></div></div>`}).join('');
 $('mix').innerHTML=mix.map(m=>`<i style="width:${m[1]}%;background:${m[2]}"></i>`).join('');
 $('leg').innerHTML=mix.map(m=>`<div><s style="background:${m[2]}"></s>${m[0]}<b>${m[1]}%</b></div>`).join('')}
$('per').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;per=b.dataset.p;
 $('per').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));kpis();chart()});
kpis();chart();resto();
</script>
